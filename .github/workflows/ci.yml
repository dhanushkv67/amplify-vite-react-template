name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      SESSION_SECRET: ci-only-session-secret-not-for-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Check for the app
        id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet - nothing to build."; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci
      - name: Migrate database
        if: steps.app.outputs.present == 'true'
        run: npm run db:migrate
      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint
      - name: Type check
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck
      - name: Test
        if: steps.app.outputs.present == 'true'
        run: npm test
      - name: Build
        if: steps.app.outputs.present == 'true'
        run: npm run build
