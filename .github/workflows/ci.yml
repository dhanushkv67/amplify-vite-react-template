name: Acceptance tests
on:
  push:
    branches: ["agentgov/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:acceptance_test@localhost:5432/task_tracker_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acceptance_test
          POSTGRES_DB: task_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') == ''
        with:
          node-version: 22
      - uses: actions/setup-node@v4
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Run acceptance tests
        run: npm test
